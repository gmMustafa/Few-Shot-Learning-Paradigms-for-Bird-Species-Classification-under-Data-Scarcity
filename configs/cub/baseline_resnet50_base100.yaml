# CUB-200-2011 Supervised Baseline — ResNet-50 on 100 base classes
# Standard FSL split: base=classes 1-100, novel=classes 151-200
# Used for: (1) NCC feature extraction, (2) upper-bound reference
#
# Script: train_evaluate/baseline/resNet50_bX/train.py
# Usage:
#   cd train_evaluate/baseline/resNet50_bX
#   python train.py --config ../../../configs/cub/baseline_resnet50_base100.yaml

image_size: 224

experiment:
  name: "resnet50_cub_base100"

# Paths are resolved relative to train_evaluate/baseline/resNet50_bX/
data_train: "../../../data_cub_prepared/train"
data_valid: "../../../data_cub_prepared/valid"
data_test:  "../../../data_cub_prepared/test"

train:
  seed: 42
  epochs: 30
  batch_size: 16
  lr: 0.0001
  num_workers: 0
  patience: 7
  scheduler: "cosine"

# Base classes: CUB class IDs 1-100 (standard FSL benchmark)
base_classes:
