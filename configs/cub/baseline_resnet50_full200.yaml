# CUB-200-2011 Full Supervised Baseline — ResNet-50 on all 200 classes
# No base/novel split; trains and evaluates on the full CUB dataset.
# Analogous to Birds20's baseline_resnet_50_fs_config.yaml (full-20 supervised).
#
# Script: train_evaluate/baseline/resNet50_FS/train.py  /  evaluate.py
# Usage:
#   cd train_evaluate/baseline/resNet50_FS
#   python train.py
#   python evaluate.py

image_size: 224

experiment:
  name: "resnet50_cub_full200"

# Paths are resolved relative to train_evaluate/baseline/resNet50_FS/
data_train: "../../../data_cub_prepared/train"
data_valid: "../../../data_cub_prepared/valid"
data_test:  "../../../data_cub_prepared/test"

train:
  seed: 42
  epochs: 30
  batch_size: 16
  lr: 0.0001
  num_workers: 0
  patience: 7
  scheduler: "cosine"

output:
  ckpt_dir:        "checkpoints/baseline/cub_full200"
  results_dir:     "../../../results/cub/baseline/resnet50_full200"
  save_best_name:  "resnet50_cub_full200_best.pth"
  save_final_name: "resnet50_cub_full200_final.pth"
