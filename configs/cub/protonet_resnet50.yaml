# CUB-200-2011 Prototypical Network â€” ResNet-50 backbone
# Standard FSL split: 100 base classes (training), 50 novel classes (evaluation)
# Episodic evaluation: 5-way K-shot, K in {1, 3, 5}, 600 episodes
#
# Script: train_evaluate/proto_net/train.py  /  evaluate.py
# Usage:
#   cd train_evaluate/proto_net
#   python train.py     --config ../../configs/cub/protonet_resnet50.yaml
#   python evaluate.py  --config ../../configs/cub/protonet_resnet50.yaml --k-shot 5 --distance euclidean

experiment:
  name: "protonet_cub_base100_novel50"

seed: 42
image_size: 224

# Paths are resolved relative to train_evaluate/proto_net/
data:
  train: "../../data_cub_prepared/train"
  val:   "../../data_cub_prepared/valid"
  test:  "../../data_cub_prepared/test"

# Base classes: CUB class IDs 1-100
