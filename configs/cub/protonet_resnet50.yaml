train:
  n_way:               5
  k_shot:              1
  q_query:             15    # CUB train has 24-25 images/class; 16 needed per episode
  episodes_per_epoch:  100
  num_epochs:          30
  lr:                  0.0001
  num_workers:         0
  patience:            10

eval:
  n_way:       5       # randomly sample 5 from 50 novel classes per episode
  k_shot:      1       # override with --k-shot 3 or --k-shot 5
  episodes:    600
  num_workers: 0
  # Note: q_query defaults to 5 in evaluate.py; CUB test has min 11 images/class

output:
  ckpt_dir:    "checkpoints/protonet_cub_base100_novel50"
  ckpt_name:   "protonet_cub_best.pth"
  results_dir: "../../results/cub/proto_net/base100_novel50"
