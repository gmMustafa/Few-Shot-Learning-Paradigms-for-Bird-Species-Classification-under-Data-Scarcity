# Matching Networks + Full Context Embedding (FCE) — B10/N10
# Adds BiLSTM support encoding + attention LSTM query encoding.

experiment:
  name: "matchingnet_fce_base10_novel10"

seed: 42
image_size: 224

fce:        true
fce_steps:  10

base_classes:
  - "ABBOTTS BABBLER"
  - "ABBOTTS BOOBY"
  - "ABYSSINIAN GROUND HORNBILL"
  - "AFRICAN CROWNED CRANE"
  - "AFRICAN EMERALD CUCKOO"
  - "AFRICAN FIREFINCH"
  - "AFRICAN OYSTER CATCHER"
  - "AFRICAN PIED HORNBILL"
  - "AFRICAN PYGMY GOOSE"
  - "ALBATROSS"

novel_classes:
  - "ALBERTS TOWHEE"
  - "ALEXANDRINE PARAKEET"
  - "ALPINE CHOUGH"
  - "ALTAMIRA YELLOWTHROAT"
  - "AMERICAN AVOCET"
  - "AMERICAN BITTERN"
  - "AMERICAN COOT"
  - "AMERICAN FLAMINGO"
  - "AMERICAN GOLDFINCH"
  - "AMERICAN KESTREL"

data:
  train: "../../data/train"
  val:   "../../data/valid"
  test:  "../../data/test"

train:
  n_way:               5
  k_shot:              1
  q_query:             15
  episodes_per_epoch:  100
  num_epochs:          30
  lr:                  0.0001
  num_workers:         0
  patience:            10

eval:
  n_way:       5
  k_shot:      1
  q_query:     5
  episodes:    600
  num_workers: 0

output:
  ckpt_dir:    "checkpoints/matchingnet_fce_base10_novel10"
  ckpt_name:   "matchingnet_fce_best.pth"
  results_dir: "../../results/matching_net_fce/base10_novel10"
