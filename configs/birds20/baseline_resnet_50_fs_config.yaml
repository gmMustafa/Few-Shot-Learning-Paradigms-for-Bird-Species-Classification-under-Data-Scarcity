# config.yaml  (Full Supervised Baseline: 20 classes, full data)

image_size: 224

experiment:
  name: "resnet50_full20"

data_train: "../../../data/train"
data_valid: "../../../data/valid"
data_test: "../../../data/test"

train:
  seed: 42
  epochs: 30
  batch_size: 16
  lr: 0.0001
  num_workers: 0        # Windows-safe
  patience: 7           # early stopping: stop if val_acc does not improve for N epochs
  scheduler: "cosine"   # CosineAnnealingLR over full epoch count

output:
  ckpt_dir: "checkpoints/baseline/full20"
  results_dir: "../../../results/birds20/baseline/resnet50/full20"
  save_best_name: "resnet50_full20_best.pth"
  save_final_name: "resnet50_full20_final.pth"
