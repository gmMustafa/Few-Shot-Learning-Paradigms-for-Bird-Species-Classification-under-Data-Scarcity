# DeiT-S supervised baseline â€” 15 base classes
# Used for NCC feature extraction after training

image_size: 224

experiment:
  name: "deit_small_base15"

data_train: "../../../data/train"
data_valid: "../../../data/valid"
data_test:  "../../../data/test"

train:
  seed: 42
  epochs: 30
  batch_size: 32       # DeiT-S is lighter than ResNet-50; larger batch is fine
  lr: 0.0001
  num_workers: 0       # Windows-safe
  patience: 7
  scheduler: "cosine"

# Fixed base classes (15) â€” identical to ResNet-50 B15 split
base_classes:
  - ABBOTTS BABBLER
  - ABBOTTS BOOBY
  - ABYSSINIAN GROUND HORNBILL
  - AFRICAN CROWNED CRANE
  - AFRICAN EMERALD CUCKOO
  - AFRICAN FIREFINCH
  - AFRICAN OYSTER CATCHER
  - AFRICAN PIED HORNBILL
  - AFRICAN PYGMY GOOSE
  - ALBATROSS
  - ALBERTS TOWHEE
  - ALEXANDRINE PARAKEET
  - ALPINE CHOUGH
  - ALTAMIRA YELLOWTHROAT
  - AMERICAN AVOCET

# Novel classes (5) â€” reserved exclusively for few-shot evaluation
novel_classes:
  - AMERICAN BITTERN
  - AMERICAN COOT
  - AMERICAN FLAMINGO
  - AMERICAN GOLDFINCH
  - AMERICAN KESTREL

output:
  ckpt_dir:        "checkpoints/vit_baseline/base15"
  results_dir:     "../../../results/birds20/vit/baseline/base15"
  save_best_name:  "deit_small_base15_best.pth"
  save_final_name: "deit_small_base15_final.pth"
