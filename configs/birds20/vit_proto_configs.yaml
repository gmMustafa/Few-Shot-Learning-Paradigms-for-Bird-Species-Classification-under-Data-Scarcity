# DeiT-S Prototypical Network Configuration
# Train: episodic on 15 base classes
# Evaluate: 5-way K-shot on 5 novel classes
# Backbone: deit_small_patch16_224 (384-dim CLS token)

experiment:
  name: "vit_protonet_base15_novel5"

seed: 42
image_size: 224

# Fixed class splits â€” identical to ResNet-50 B15/N5 split
base_classes:
  - "ABBOTTS BABBLER"
  - "ABBOTTS BOOBY"
  - "ABYSSINIAN GROUND HORNBILL"
  - "AFRICAN CROWNED CRANE"
  - "AFRICAN EMERALD CUCKOO"
  - "AFRICAN FIREFINCH"
  - "AFRICAN OYSTER CATCHER"
  - "AFRICAN PIED HORNBILL"
  - "AFRICAN PYGMY GOOSE"
  - "ALBATROSS"
  - "ALBERTS TOWHEE"
  - "ALEXANDRINE PARAKEET"
  - "ALPINE CHOUGH"
  - "ALTAMIRA YELLOWTHROAT"
  - "AMERICAN AVOCET"

novel_classes:
  - "AMERICAN BITTERN"
  - "AMERICAN COOT"
  - "AMERICAN FLAMINGO"
  - "AMERICAN GOLDFINCH"
  - "AMERICAN KESTREL"

data:
  train: "../../../data/train"
  val:   "../../../data/valid"
  test:  "../../../data/test"

train:
  n_way:               5
  k_shot:              1
  q_query:             15
  episodes_per_epoch:  100
  num_epochs:          30
  lr:                  0.0001
  num_workers:         0
  patience:            10

eval:
  n_way:       5
  k_shot:      1       # override via --k-shot
  q_query:     5
  episodes:    600
  num_workers: 0

output:
  ckpt_dir:    "checkpoints/vit_protonetbase15_novel5"
  ckpt_name:   "vit_protonet_best.pth"
  results_dir: "../../../results/birds20/vit/proto_net/base15_novel5"
