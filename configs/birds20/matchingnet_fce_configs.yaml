# Matching Networks + Full Context Embedding (FCE) â€” B15/N5
# Adds BiLSTM support encoding + attention LSTM query encoding.
# See models/matchingnet.py for FCE architecture details.

experiment:
  name: "matchingnet_fce_base15_novel5"

seed: 42
image_size: 224

# FCE settings
fce:        true
fce_steps:  10      # number of inner-loop steps in QueryAttLSTM

# Class splits â€” identical to non-FCE matchingnet_configs.yaml
base_classes:
  - "ABBOTTS BABBLER"
  - "ABBOTTS BOOBY"
  - "ABYSSINIAN GROUND HORNBILL"
  - "AFRICAN CROWNED CRANE"
  - "AFRICAN EMERALD CUCKOO"
  - "AFRICAN FIREFINCH"
  - "AFRICAN OYSTER CATCHER"
  - "AFRICAN PIED HORNBILL"
  - "AFRICAN PYGMY GOOSE"
  - "ALBATROSS"
  - "ALBERTS TOWHEE"
  - "ALEXANDRINE PARAKEET"
  - "ALPINE CHOUGH"
  - "ALTAMIRA YELLOWTHROAT"
  - "AMERICAN AVOCET"

novel_classes:
  - "AMERICAN BITTERN"
  - "AMERICAN COOT"
  - "AMERICAN FLAMINGO"
  - "AMERICAN GOLDFINCH"
  - "AMERICAN KESTREL"

data:
  train: "../../data/train"
  val:   "../../data/valid"
  test:  "../../data/test"

train:
  n_way:               5
  k_shot:              1
  q_query:             15
  episodes_per_epoch:  100
  num_epochs:          30
  lr:                  0.0001
  num_workers:         0
  patience:            10

eval:
  n_way:       5
  k_shot:      1
  q_query:     5
  episodes:    600
  num_workers: 0

output:
  ckpt_dir:    "checkpoints/matchingnet_fce_base15_novel5"
  ckpt_name:   "matchingnet_fce_best.pth"
  results_dir: "../../results/birds20/matching_net_fce/base15_novel5"
