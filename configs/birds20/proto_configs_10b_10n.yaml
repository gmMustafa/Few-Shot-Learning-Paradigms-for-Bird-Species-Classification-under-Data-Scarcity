# ============================================
# Prototypical Network Configuration (10 Base / 10 Novel)
# ============================================
# Train: episodic on 10 base classes
# Evaluate: 5-way K-shot sampled from 10 novel classes
# ============================================

experiment:
  name: "protonet_base10_novel10"

seed: 42
image_size: 224

# --------------------------------------------
# Class Split: 10 Base / 10 Novel
# --------------------------------------------
base_classes:
  - "ABBOTTS BABBLER"
  - "ABBOTTS BOOBY"
  - "ABYSSINIAN GROUND HORNBILL"
  - "AFRICAN CROWNED CRANE"
  - "AFRICAN EMERALD CUCKOO"
  - "AFRICAN FIREFINCH"
  - "AFRICAN OYSTER CATCHER"
  - "AFRICAN PIED HORNBILL"
  - "AFRICAN PYGMY GOOSE"
  - "ALBATROSS"

novel_classes:
  - "ALBERTS TOWHEE"
  - "ALEXANDRINE PARAKEET"
  - "ALPINE CHOUGH"
  - "ALTAMIRA YELLOWTHROAT"
  - "AMERICAN AVOCET"
  - "AMERICAN BITTERN"
  - "AMERICAN COOT"
  - "AMERICAN FLAMINGO"
  - "AMERICAN GOLDFINCH"
  - "AMERICAN KESTREL"

# --------------------------------------------
# Data Paths
# --------------------------------------------
data:
  train: "../../data/train"
  val:   "../../data/valid"
  test:  "../../data/test"

# --------------------------------------------
# Training Configuration
# --------------------------------------------
train:
  n_way:               5
  k_shot:              1
  q_query:             15       # base classes have ~160 images â†’ ~10% overlap, strong gradient
  episodes_per_epoch:  100
  num_epochs:          30
  lr:                  0.0001
  num_workers:         0
  patience:            10

# --------------------------------------------
# Evaluation Configuration
# --------------------------------------------
eval:
  n_way:       5       # sampled from 10 novel classes
  k_shot:      1       # override via CLI if needed
  q_query:     5       # novel classes have ~25 images â†’ keep low to reduce episode correlation
  episodes:    600
  num_workers: 0

# --------------------------------------------
# Output Paths
# --------------------------------------------
output:
  ckpt_dir:    "checkpoints/protonet_base10_novel10"
  ckpt_name:   "protonet_best.pth"
  results_dir: "../../results/birds20/proto_net/base10_novel10"