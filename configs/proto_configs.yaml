# Prototypical Network Configuration
# Train: episodic on 15 base classes
# Evaluate: 5-way K-shot on 5 novel classes

experiment:
  name: "protonet_base15_novel5"

seed: 42
image_size: 224

# Fixed class splits — must match baseline configs exactly
base_classes:
  - "ABBOTTS BABBLER"
  - "ABBOTTS BOOBY"
  - "ABYSSINIAN GROUND HORNBILL"
  - "AFRICAN CROWNED CRANE"
  - "AFRICAN EMERALD CUCKOO"
  - "AFRICAN FIREFINCH"
  - "AFRICAN OYSTER CATCHER"
  - "AFRICAN PIED HORNBILL"
  - "AFRICAN PYGMY GOOSE"
  - "ALBATROSS"
  - "ALBERTS TOWHEE"
  - "ALEXANDRINE PARAKEET"
  - "ALPINE CHOUGH"
  - "ALTAMIRA YELLOWTHROAT"
  - "AMERICAN AVOCET"

novel_classes:
  - "AMERICAN BITTERN"
  - "AMERICAN COOT"
  - "AMERICAN FLAMINGO"
  - "AMERICAN GOLDFINCH"
  - "AMERICAN KESTREL"

data:
  train: "../../data/train"
  val:   "../../data/valid"
  test:  "../../data/test"

train:
  n_way:               5
  k_shot:              1     # support images per class during training
  q_query:             15    # query images per class during training
  episodes_per_epoch:  100
  num_epochs:          30
  lr:                  0.0001
  num_workers:         0     # Windows-safe
  patience:            10    # early stopping

eval:
  n_way:     5       # always 5 (we have exactly 5 novel classes)
  k_shot:    1       # default; override with --k-shot 5 for 5-shot eval
  episodes:  600     # number of episodes to average over
  num_workers: 0

output:
  ckpt_dir:  "checkpoints/protonetbase15_novel5"
  ckpt_name: "protonet_best.pth"
  results_dir: "../../results/proto_net/base15_novel5"
